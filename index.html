<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Bank</title>
<meta name="description" content="Offline quiz banks with mock exams, flashcards and pronunciation.">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D131B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quiz Bank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: technician's bench. A slim status bar, one working column (max 920px), cards only for things you can start or answer. Amber is the "status LED" accent. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E8ECF1; --ink:#152033; --muted:#566275; --line:#D5DBE3;
  --accent:#B45309; --accent-soft:#FBEBD7; --accent-ink:#FFFFFF;
  --ok:#157A3C; --ok-soft:#E3F3E8; --bad:#B3261E; --bad-soft:#FBE7E5; --warn:#8A5A00; --warn-soft:#FDF1D6;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131B; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B6; --line:#283445;
  --accent:#F2A33A; --accent-soft:#3A2A12; --accent-ink:#1B1204;
  --ok:#5CD48A; --ok-soft:#123222; --bad:#FF8A80; --bad-soft:#3B1715; --warn:#F2C35A; --warn-soft:#33270C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131B; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B6; --line:#283445;
  --accent:#F2A33A; --accent-soft:#3A2A12; --accent-ink:#1B1204;
  --ok:#5CD48A; --ok-soft:#123222; --bad:#FF8A80; --bad-soft:#3B1715; --warn:#F2C35A; --warn-soft:#33270C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:920px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.1rem;font-weight:700;letter-spacing:.005em}
h2{font-size:1.45rem;font-weight:600}
h3{font-size:1.12rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:.82em}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* status bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.02em}
.led{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bar .meta{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}

/* hero */
.hero{display:grid;gap:10px;margin-bottom:24px}
.hero p{max-width:62ch;color:var(--muted);font-size:1.05rem}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* quick start */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:28px}
.qbtn{display:grid;gap:4px;text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s,transform .15s}
.qbtn:hover{border-color:var(--accent)}
.qbtn strong{font-family:var(--f-display);font-size:1.12rem;font-weight:600}
.qbtn span{font-size:.88rem;color:var(--muted)}
.qbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qbtn.primary span{color:var(--accent-ink);opacity:.85}
.qbtn[disabled]{opacity:.5;cursor:not-allowed}

/* settings */
.settings{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--sunk);margin-bottom:22px;font-size:.92rem}
.settings label{display:flex;align-items:center;gap:8px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.settings .lbl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* lists */
.examhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.examhead:first-child{margin-top:0}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.row .t{min-width:0;display:grid;gap:3px}
.row .t b{font-weight:600}
.row .sub{font-size:.86rem;color:var(--muted)}
.row .acts{display:flex;align-items:center;gap:10px}
.go{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.go:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.go.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.go.ghost:hover{border-color:var(--accent);color:var(--ink);background:transparent}
.pct{font-family:var(--f-mono);font-size:.8rem;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pct.good{background:var(--ok-soft);color:var(--ok)}.pct.mid{background:var(--warn-soft);color:var(--warn)}.pct.low{background:var(--bad-soft);color:var(--bad)}
.weight{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
details.obj{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.obj>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600}
details.obj>summary::-webkit-details-marker{display:none}
details.obj>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details.obj[open]>summary::after{content:"\2212"}
details.obj .inner{padding:0 10px 10px;display:grid;gap:6px}
.orow{display:grid;grid-template-columns:4.6rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid var(--line)}
.orow .code{font-family:var(--f-mono);font-size:.8rem;color:var(--accent)}
.orow .ot{min-width:0;font-size:.93rem}
.orow .acts{display:flex;gap:8px;align-items:center}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.03em;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.tag.gap{background:var(--warn-soft);color:var(--warn)}
.tag.sc{background:var(--accent-soft);color:var(--accent)}

/* coverage */
.note{padding:14px 16px;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 var(--r) var(--r) 0;display:grid;gap:8px;margin-bottom:16px}
.note ul{margin:0;padding-left:1.1rem;display:grid;gap:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
td.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.status{font-family:var(--f-mono);font-size:.72rem;padding:2px 7px;border-radius:5px;white-space:nowrap}
.status.ok{background:var(--ok-soft);color:var(--ok)}.status.thin{background:var(--warn-soft);color:var(--warn)}.status.none{background:var(--bad-soft);color:var(--bad)}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qtop .count{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.timer{font-family:var(--f-mono);font-size:.9rem;padding:3px 9px;border-radius:6px;background:var(--sunk)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.progress{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-bottom:22px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,4vw,28px);display:grid;gap:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.qtext{font-size:1.18rem;line-height:1.45;font-weight:500;max-width:68ch}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:10px;align-items:start;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt .k{font-family:var(--f-mono);font-weight:600;font-size:.85rem;width:1.7rem;height:1.7rem;display:grid;place-items:center;border-radius:6px;background:var(--sunk);color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.feedback{border-radius:10px;padding:14px 16px;display:grid;gap:6px}
.feedback.ok{background:var(--ok-soft)}.feedback.bad{background:var(--bad-soft)}
.feedback b{font-family:var(--f-display);font-size:1.1rem}
.feedback.ok b{color:var(--ok)}.feedback.bad b{color:var(--bad)}
.qnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.qnav .r{display:flex;gap:10px;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn:hover:not([disabled]){border-color:var(--ink)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.main:hover:not([disabled]){filter:brightness(1.05);border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.flag[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.hint{font-size:.82rem;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:18px}
.dots button{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:.68rem;cursor:pointer;color:var(--muted);padding:0}
.dots button.done{background:var(--sunk);color:var(--ink)}
.dots button.flagged{border-color:var(--warn);color:var(--warn)}
.dots button.cur{outline:2px solid var(--accent)}

/* results */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;margin-bottom:24px}
.big{font-family:var(--f-display);font-size:4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:1.4rem;color:var(--muted)}
.score .t{display:grid;gap:6px;min-width:0}
.bars{display:grid;gap:10px;margin:8px 0 26px}
.brow{display:grid;grid-template-columns:minmax(0,17rem) minmax(0,1fr) 5.2rem;gap:12px;align-items:center;font-size:.92rem}
.brow .nm{min-width:0}
.brow .nm .mono{color:var(--accent)}
.track{height:12px;border-radius:999px;background:var(--sunk);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px}
.brow .v{font-family:var(--f-mono);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.review{display:grid;gap:10px}
.ritem{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px;display:grid;gap:6px}
.ritem.bad{border-left-color:var(--bad)}.ritem.ok{border-left-color:var(--ok)}
.ritem .ans{font-size:.92rem}
.ritem .ans .y{color:var(--bad)}.ritem .ans .c{color:var(--ok);font-weight:600}
.ritem .exp{font-size:.92rem;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted);display:grid;gap:4px}

/* flashcards + pronunciation */
.fsetup{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:16px}
.fsetup .line{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
select,input[type="search"]{max-width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type="search"]{min-width:0;flex:1 1 220px}
.flip{position:relative;min-height:290px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;text-align:center;padding:28px clamp(16px,5vw,40px);transition:border-color .15s}
.flip:hover{border-color:var(--muted)}
.flip .face{display:grid;gap:12px;justify-items:center;max-width:52ch}
.flip .term{font-family:var(--f-mono);font-weight:600;font-size:clamp(1.9rem,6vw,2.8rem);line-height:1.15;color:var(--ink);word-break:break-word}
.flip .exp{font-family:var(--f-display);font-size:1.35rem;font-weight:600}
.flip .def{font-size:1.08rem;color:var(--ink)}
.flip .side{position:absolute;top:12px;left:14px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.flip.back{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--surface) 70%)}
.say{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.resp{font-family:var(--f-mono);font-size:.95rem;padding:3px 9px;border-radius:6px;background:var(--sunk)}
.kind{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.04em;padding:2px 7px;border-radius:5px;white-space:nowrap}
.kind.word{background:var(--accent-soft);color:var(--accent)}
.kind.letters{background:var(--sunk);color:var(--muted)}
.speak{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;flex:none;padding:0}
.speak:hover{border-color:var(--accent)}
.speak svg{width:16px;height:16px;fill:var(--ink)}
.fnav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.learn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.plist{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.prow{display:grid;grid-template-columns:8.5rem minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .pt{font-family:var(--f-mono);font-weight:600;word-break:break-word}
.prow .pm{min-width:0;display:grid;gap:3px}
.prow .pm .x{font-size:.92rem}
.prow .pm .how{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:620px){.prow{grid-template-columns:minmax(0,1fr) auto}.prow .pm{grid-column:1/-1;order:3}}

@media (max-width:620px){
  h1{font-size:1.7rem}
  .brow{grid-template-columns:minmax(0,1fr) 4.6rem}
  .brow .track{grid-column:1/-1;order:3}
  .score{grid-template-columns:1fr}
  .big{font-size:3.2rem}
  .orow{grid-template-columns:3.9rem minmax(0,1fr)}
  .orow .acts{grid-column:2}
  .row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* app additions */
.bar .brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barr{display:flex;align-items:center;gap:10px}
#libbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:600;cursor:pointer}
#libbtn[hidden]{display:none}
.notice{border:1px solid var(--line);border-left:4px solid var(--ok);background:var(--surface);border-radius:var(--r);padding:12px 14px;margin:0 0 18px;font-size:.95rem}
.notice.bad{border-left-color:var(--bad)}
.bankrow .t .sub+.sub{margin-top:2px}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 10px 8px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:10;max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand"><span class="led" aria-hidden="true"></span><span id="brand">Quiz Bank</span></div>
    <div class="barr"><span class="meta" id="barmeta"></span><button id="libbtn" hidden>All banks</button></div>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer class="foot">
    <p id="bankfoot" hidden></p>
    <p>Your scores, missed questions and flashcard progress are saved on this device only. Use <b>Save progress backup</b> in All banks to move them to another device.</p>
  </footer>
</div>
<div id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
